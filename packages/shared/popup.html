<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return YouTube Live Subscriptions</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Return YouTube Live Subscriptions</h1>
        <button id="openSettingsBtn" class="button button--secondary app-header__settings">Options</button>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab tab--active" id="tabLive" role="tab" aria-selected="true">Live</button>
        <button class="tab" id="tabScan" role="tab" aria-selected="false">Scan</button>
      </nav>

      <section class="tab-panel" id="panelLive">
        <div class="channels-toolbar">
          <span id="liveCount" class="channel-count"></span>
        </div>
        <p id="liveHint" class="note" hidden></p>
        <ul id="liveList" class="channel-list"></ul>
      </section>

      <section class="tab-panel tab-panel--hidden" id="panelScan">
        <div class="channels-toolbar">
          <span class="channel-count">Subscription Scanner</span>
          <button id="scanBtn">Scan from YouTube</button>
        </div>
        <p id="scanHint" class="note">Open https://www.youtube.com/feed/channels, scroll all the way down once to load all subscriptions, then click Scan. Channel inclusion and priority are managed in Options.</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
